<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Kelola Komentar - Momenin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
    .comment-card { border: none; border-radius: 15px; margin-bottom: 15px; }
    .stat-badge { font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; }
    .btn-delete { border-radius: 10px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold">📋 Panel Kelola Komentar</h2>
      <p class="text-muted">Undangan: <span id="pengantinLabel" class="badge bg-warning text-dark fs-6">...</span></p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div id="commentList">
          <div class="text-center py-5">
            <div class="spinner-border text-warning"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // MENGGUNAKAN NAMA VARIABEL UNIK AGAR TIDAK REDECLARATION
    var SB_URL = 'https://occvvlzeynsjcgqqllky.supabase.co';
    var SB_KEY = 'sb_publishable_2WD5XQaU228TsA-SiafWbQ_K2PHbRG4'; 
    
    // Gunakan window.momeninClient untuk isolasi total
    if (typeof window.momeninClient === 'undefined') {
        window.momeninClient = window.supabase.createClient(SB_URL, SB_KEY);
    }

    var urlParams = new URLSearchParams(window.location.search);
    var slugOwner = urlParams.get('pengantin');

    document.addEventListener('DOMContentLoaded', function() {
      if (!slugOwner) {
        document.getElementById("commentList").innerHTML = `<div class="alert alert-danger text-center">Parameter pengantin tidak ditemukan.</div>`;
        return;
      }
      document.getElementById("pengantinLabel").textContent = slugOwner;
      loadKomentar();
    });

    async function loadKomentar() {
      var container = document.getElementById("commentList");

      var { data, error } = await window.momeninClient
        .from('comments')
        .select('*')
        .eq('slug', slugOwner)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="text-center text-danger">Error: ${error.message}</div>`;
        return;
      }

      if (data.length === 0) {
        container.innerHTML = `<div class="card p-5 text-center text-muted">Belum ada komentar.</div>`;
        return;
      }

      var html = "";
      data.forEach(function(komen) {
        var tgl = new Date(komen.created_at).toLocaleString('id-ID');
        html += `
          <div class="card comment-card shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <h6 class="fw-bold mb-1">${komen.name} <span class="stat-badge bg-light text-secondary ms-2">${komen.attendance}</span></h6>
                <p class="mb-1 text-dark">${komen.message}</p>
                <small class="text-muted" style="font-size: 11px;">${tgl}</small>
              </div>
              <button class="btn btn-outline-danger btn-sm btn-delete" onclick="hapusKomentar('${komen.id}')">Hapus</button>
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    async function hapusKomentar(id) {
      if (!confirm("Hapus komentar ini secara permanen?")) return;

      var { error } = await window.momeninClient
        .from('comments')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Gagal: " + error.message);
      } else {
        loadKomentar();
      }
    }
  </script>
</body>
</html>
