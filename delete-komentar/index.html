<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Kelola Komentar - Momenin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .comment-card { border: none; border-radius: 15px; transition: 0.3s; margin-bottom: 15px; }
    .comment-card:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .stat-badge { font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; }
    .btn-delete { border-radius: 10px; padding: 5px 15px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold text-dark">📋 Panel Kelola Komentar</h2>
      <p class="text-muted">Undangan: <span id="pengantinLabel" class="badge bg-warning text-dark fs-6">...</span></p>
      <hr class="w-25 mx-auto">
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div id="commentList">
          <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-muted">Memuat komentar...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. CONFIG SUPABASE
    const SB_URL = 'https://occvvlzeynsjcgqqllky.supabase.co';
    const SB_KEY = 'sb_publishable_2WD5XQaU228TsA-SiafWbQ_K2PHbRG4'; 
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    // 2. AMBIL PARAMETER URL (?pengantin=rahmat-ayu)
    const urlParams = new URLSearchParams(window.location.search);
    const slugOwner = urlParams.get('pengantin');

    document.addEventListener('DOMContentLoaded', () => {
      if (!slugOwner) {
        document.getElementById("commentList").innerHTML = `
          <div class="alert alert-danger text-center">
            ⚠️ <b>Error:</b> Parameter pengantin tidak ditemukan di URL.
          </div>`;
        return;
      }
      document.getElementById("pengantinLabel").textContent = slugOwner;
      loadKomentar();
    });

    // 3. FUNGSI LOAD DATA
    async function loadKomentar() {
      const container = document.getElementById("commentList");

      const { data, error } = await supabase
        .from('comments')
        .select('*')
        .eq('slug', slugOwner)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="text-center text-danger">Gagal memuat data: ${error.message}</div>`;
        return;
      }

      if (data.length === 0) {
        container.innerHTML = `
          <div class="card shadow-sm p-5 text-center text-muted" style="border-radius: 15px;">
            Belum ada komentar masuk untuk undangan ini.
          </div>`;
        return;
      }

      let html = "";
      data.forEach((komen) => {
        const tgl = new Date(komen.created_at).toLocaleString('id-ID', { 
          dateStyle: 'medium', 
          timeStyle: 'short' 
        });

        html += `
          <div class="card comment-card shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <h6 class="fw-bold mb-1">${komen.name} 
                  <span class="stat-badge bg-light text-secondary ms-2">${komen.attendance}</span>
                </h6>
                <p class="mb-1 text-dark">${komen.message}</p>
                <small class="text-muted" style="font-size: 11px;">${tgl}</small>
              </div>
              <button class="btn btn-outline-danger btn-delete btn-sm" onclick="hapusKomentar('${komen.id}')">
                Hapus
              </button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 4. FUNGSI HAPUS DATA
    async function hapusKomentar(id) {
      if (!confirm("Komentar ini akan dihapus permanen. Lanjutkan?")) return;

      const { error } = await supabase
        .from('comments')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Gagal menghapus: " + error.message);
      } else {
        // Refresh list tanpa reload halaman
        loadKomentar();
      }
    }
  </script>

</body>
</html>
